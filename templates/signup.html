{% extends "base.html" %}
{% block title %}Sign up — DevTracker{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 mt-4">
      <h3 class="mb-3">Create your account</h3>
      <form method="POST">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" name="name">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-accent w-100">Sign up</button>
      </form>
      <p class="text-secondary text-center mt-3 mb-0">
        Already have an account? <a href="{{ url_for('login') }}" class="text-accent">Log in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
